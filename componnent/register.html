<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Registration — Author Studio</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <main class="page-wrapper">
        <section class="card auth-card">
            <div class="top-bar-row">
                <a href="../index.html" class="back-link">&larr; Back to Home</a>
                <button type="button" id="theme-toggle" class="btn btn-ghost btn-sm">Dark Mode</button>
            </div>

            <header class="card-header">
                <h1>Author Registration</h1>
                <p class="subtitle">Create a new author profile with your pen name and short biography.</p>
            </header>

            <div id="alert-box" class="alert" role="alert" hidden></div>

            <form id="register-form" action="../php/process_register.php" method="POST" novalidate>
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="e.g., Jordan Vance"
                        autocomplete="name" minlength="3" maxlength="100" required>
                    <small class="error-text" id="full_name-error"></small>
                </div>

                <div class="form-group">
                    <label for="pen_name">Pen Name (Optional)</label>
                    <input type="text" id="pen_name" name="pen_name" placeholder="e.g., J. Vance / Tech Columnist"
                        maxlength="100">
                    <small class="error-text" id="pen_name-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="author@example.com" autocomplete="email"
                        required>
                    <small class="error-text" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio (Optional)</label>
                    <textarea id="bio" name="bio" rows="3" maxlength="400"
                        placeholder="Share your writing focus or background..."></textarea>
                    <small class="error-text" id="bio-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password"
                            placeholder="Minimum 8 characters, upper/lowercase &amp; numbers"
                            autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="password"
                            aria-label="Show or hide password">
                            Show
                        </button>
                    </div>
                    <div class="strength-meter" aria-hidden="true">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <small class="helper-text" id="strength-label">Password strength: Not entered</small>
                    <small class="error-text" id="password-error"></small>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="confirm_password"
                            aria-label="Show or hide confirm password">
                            Show
                        </button>
                    </div>
                    <small class="error-text" id="confirm_password-error"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Author Account</button>
            </form>

            <footer class="card-footer">
                <p>Already have an author account? <a href="login.html">Sign in here</a></p>
            </footer>
        </section>
    </main>

    <script src="../assets/js/script.js"></script>
</body>

</html>
