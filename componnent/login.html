<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Sign In — Author Studio</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <main class="page-wrapper">
        <section class="card auth-card">
            <div class="top-bar-row">
                <a href="../index.html" class="back-link">&larr; Back to Home</a>
                <button type="button" id="theme-toggle" class="btn btn-ghost btn-sm">Dark Mode</button>
            </div>

            <header class="card-header">
                <h1>Author Sign In</h1>
                <p class="subtitle">Access your article studio, publishing analytics, and security logs.</p>
            </header>

            <div id="alert-box" class="alert" role="alert" hidden></div>

            <form id="login-form" action="../php/process_login.php" method="POST" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="author@example.com" autocomplete="email"
                        required>
                    <small class="error-text" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="password"
                            aria-label="Show or hide password">
                            Show
                        </button>
                    </div>
                    <small class="error-text" id="password-error"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In to Studio</button>
            </form>

            <footer class="card-footer">
                <p>Don't have an author account yet? <a href="register.html">Create an account</a></p>
            </footer>
        </section>
    </main>

    <script src="../assets/js/script.js"></script>
</body>

</html>
